<script>
/* ---- offline app: service worker + notifications ---- */
(function(){
  const DB="ascension",ST="kv";
  function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
  async function put(k,v){try{const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction(ST,"readwrite");tx.objectStore(ST).put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}}
  let reg=null;
  if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
    let reloaded=false;
    if(navigator.serviceWorker.controller)navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!reloaded){reloaded=true;location.reload()}});
    document.addEventListener("visibilitychange",()=>{if(!document.hidden&&reg)reg.update().catch(()=>{})});
    navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(async r=>{reg=r;r.update().catch(()=>{});
      try{if("periodicSync" in r){const st=await navigator.permissions.query({name:"periodic-background-sync"});if(st.state==="granted")await r.periodicSync.register("ascension-daily",{minInterval:6*60*60*1000})}}catch(e){}
    }).catch(()=>{});
  }
  const on=()=>"Notification" in window&&Notification.permission==="granted";
  const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  let sent={};try{sent=JSON.parse(localStorage.getItem("asc.sent")||"{}")}catch(e){}
  async function show(title,body,tag){
    if(!on())return;
    const opt={body,tag,icon:"./icon-192.png",badge:"./icon-192.png"};
    try{const r=reg||await navigator.serviceWorker.ready;await r.showNotification(title,opt)}catch(e){try{new Notification(title,opt)}catch(_){}}
  }
  function tick(){
    if(!on())return;
    let st;try{st=JSON.parse(localStorage.getItem("studydesk.v1"))}catch(e){}
    if(!st||!st.blocks)return;
    const now=new Date(),d=ymd(now),w=now.getDay(),m=now.getHours()*60+now.getMinutes();
    for(const b of st.blocks){if(!b.days.includes(w))continue;
      const [h,mm]=b.start.split(":").map(Number),s=h*60+mm,key=b.id+"@"+d;
      if(s-m<=10&&s-m>=0&&!sent[key]){sent[key]=1;show(b.title,"Starts at "+b.start+" · until "+b.end,key)}}
    for(const k in sent)if(!k.endsWith(d))delete sent[k];
    try{localStorage.setItem("asc.sent",JSON.stringify(sent))}catch(e){}
  }
  setInterval(tick,30000);setTimeout(tick,1500);
  window.ascNotify={
    mirror:s=>put("state",s),
    wire(sh){const t=sh.querySelector("#ntfTxt"),b=sh.querySelector("#ntfBtn");if(!t||!b)return;
      const upd=()=>{if(!("Notification" in window)){t.textContent="This browser can't show notifications.";b.hidden=true;return}
        const p=Notification.permission;
        t.textContent=p==="granted"?"On. You'll get an alert 10 minutes before each timetable block while ascension. is open or recently used, plus a daily summary when your phone allows it. For alerts that always arrive, also use Remind me weekly on each block.":p==="denied"?"Blocked. Turn notifications on for this app in your phone's Settings › Apps.":"Get an alert before each timetable block starts.";
        b.hidden=p!=="default"};
      upd();b.onclick=async()=>{await Notification.requestPermission();upd();tick();if(on())show("ascension.","Notifications are on.","asc-test")}}
  };
  try{const s0=JSON.parse(localStorage.getItem("studydesk.v1"));if(s0)put("state",s0)}catch(e){}
})();

</script>
<style>
/* Layout: one-column phone app in near-black monochrome; wide-tracked thin caps, brightness carries priority; sticky header, bottom tab bar, bottom sheet */
/* Deliberately single dark theme. */
:root{
  color-scheme:dark;
  --bg:#060606; --surface:#0c0c0c; --raised:#121212; --sunk:#030303; --line:#191918; --line-hi:#252524;
  --fg:#b4b4ad; --muted:#686863; --dim:#3c3c39;
  --ink:#d6d6cf; --ink-fg:#060606;
  --hi:#d6d6cf; --hi-fg:#060606;
  --urgent:#e2e2db; --high:#a3a39c; --med:#77776f; --low:#55554f; --good:#8b8b85;
  --shadow:none;
  --f-display:"Unica One","Arial Narrow",sans-serif;
  --f-body:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
  --grain:none;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background-color:var(--bg);background-image:var(--grain),radial-gradient(90% 50% at 50% -10%,#141413 0%,transparent 70%);background-attachment:fixed;
  color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;font-weight:400;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--bg) 75%,transparent);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 12px;
  display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:400;font-size:1.7rem;line-height:1;letter-spacing:.14em;text-transform:none;margin:0;flex:1;min-width:0;color:var(--ink);display:flex;align-items:center;gap:12px}
.brand .mark{width:38px;height:38px;flex:0 0 auto;border:1px solid var(--line-hi)}
.brand small{display:block;margin-top:5px;font-family:var(--f-mono);font-weight:300;font-size:.66rem;color:var(--muted);letter-spacing:.18em;text-transform:uppercase}
.iconbtn{border:1px solid var(--line-hi);background:var(--surface);border-radius:2px;width:42px;height:42px;display:grid;place-items:center;color:var(--muted)}
.iconbtn svg{width:20px;height:20px}

main{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px 130px;display:flex;flex-direction:column;gap:26px}
section.block{display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.sechead h2{font-family:var(--f-display);font-weight:400;font-size:1.05rem;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;margin:0;flex:1;text-wrap:balance}
.sechead .meta{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);letter-spacing:.04em}

.banner{border:1px solid var(--line-hi);color:var(--fg);background:repeating-linear-gradient(-45deg,rgba(255,255,255,.018) 0 10px,transparent 10px 20px);padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.95rem}
.banner p{margin:0;flex:1;min-width:180px}
.banner b{color:var(--ink);font-weight:600}
.banner button{border:0;background:var(--ink);color:var(--ink-fg);border-radius:2px;padding:8px 12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:.82rem}

/* exam countdowns: stencilled tags */
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.cd{flex:0 0 auto;min-width:148px;max-width:200px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--line-hi);padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.cd .n{font-family:var(--f-display);font-weight:400;font-size:2.4rem;color:var(--ink);line-height:.85;font-variant-numeric:tabular-nums}
.cd .n span{font-family:var(--f-mono);font-size:.7rem;font-weight:500;color:var(--muted);margin-left:4px;letter-spacing:.1em;text-transform:uppercase}
.cd .t{font-weight:600;font-size:.95rem;overflow-wrap:anywhere}
.cd .s{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);letter-spacing:.04em}
.cd.soon{border-top-color:var(--ink)}
.cd.soon .n{color:var(--urgent)}

/* task rows */
.list{display:flex;flex-direction:column;gap:6px}
.task{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--pc,var(--low));padding:12px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
.task.done{opacity:.4}
.task.done .ttl{text-decoration:line-through}
.check{width:26px;height:26px;border-radius:0;border:2px solid var(--line-hi);background:var(--sunk);display:grid;place-items:center;margin-top:1px}
.check[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.check svg{width:16px;height:16px}
.tbody{min-width:0;display:flex;flex-direction:column;gap:6px}
.ttl{font-weight:600;font-size:1.02rem;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.03em;padding:2px 7px;border:1px solid var(--line);background:var(--sunk);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.chip .dot{width:7px;height:7px;background:var(--c)}
.chip.prio{color:var(--pc);background:transparent;border-color:var(--pc);font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.chip.late{color:var(--ink);border-color:var(--ink)}
.why{font-size:.8rem;color:var(--dim)}
.more{border:0;background:transparent;width:34px;height:34px;display:grid;place-items:center;color:var(--muted)}
.more svg{width:18px;height:18px}
.score{font-family:var(--f-mono);font-size:.7rem;color:var(--dim);text-align:center}

.empty{border:1px dashed var(--line-hi);padding:18px;color:var(--muted);text-align:center;font-size:.95rem}

.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.fbtn{flex:0 0 auto;border:1px solid var(--line-hi);background:var(--surface);border-radius:0;padding:6px 11px;font-size:.85rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fbtn .dot{width:8px;height:8px;background:var(--c)}

.rev{background:var(--surface);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px}
.rev .row{display:flex;gap:10px;align-items:flex-start}
.rev .row .tbody{flex:1}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.rate{border:1px solid var(--line-hi);background:var(--sunk);border-radius:0;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em}
.rate small{font-family:var(--f-mono);font-weight:500;font-size:.66rem;color:var(--muted);letter-spacing:0;text-transform:none}
.rate.again{color:var(--muted)} .rate.easy{color:var(--ink)}

.exam{background:var(--surface);border:1px solid var(--line);padding:12px;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center}
.exam .d{text-align:center;border-right:1px dashed var(--line-hi);padding-right:10px}
.exam .d b{display:block;font-family:var(--f-display);font-weight:400;font-size:2.1rem;line-height:.9;font-variant-numeric:tabular-nums}
.exam .d small{font-family:var(--f-mono);font-size:.64rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.exam.past{opacity:.4}

/* month timetable */
.mhead{display:flex;align-items:center;gap:8px}
.mhead h2{font-family:var(--f-display);font-weight:400;font-size:1.3rem;letter-spacing:.26em;color:var(--ink);text-transform:uppercase;margin:0;flex:1}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dow{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.12em;color:var(--dim);text-align:center;padding:2px 0}
.day{background:var(--surface);border:1px solid var(--line);min-height:70px;padding:4px;display:flex;flex-direction:column;gap:3px;text-align:left;border-radius:0;min-width:0;overflow:hidden}
.day.out{background:transparent;border-color:transparent;opacity:.35}
.day.today{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.day.sel{background:var(--raised);border-color:var(--muted)}
.day.exam{background:repeating-linear-gradient(-45deg,rgba(255,255,255,.045) 0 6px,transparent 6px 12px),var(--surface)}
.day .num{font-family:var(--f-mono);font-size:.74rem;font-weight:600;color:var(--muted)}
.day.today .num{color:var(--ink)}
.bars{display:flex;flex-direction:column;gap:2px;min-width:0}
.bar{height:5px;background:var(--c)}
.bar.x{height:auto;font-family:var(--f-mono);font-size:.56rem;line-height:1.2;color:var(--bg);background:var(--ink);padding:1px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar.r{height:3px;background:transparent;border-top:2px dotted var(--c)}
.more-n{font-family:var(--f-mono);font-size:.56rem;color:var(--muted)}
.load{height:3px;background:var(--line);margin-top:auto}
.load i{display:block;height:100%;background:var(--ink)}
/* week timetable */
.daypick{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dp{border:1px solid var(--line);background:var(--surface);border-radius:0;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.dp .w{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.dp .n{font-family:var(--f-display);font-size:1.15rem;color:var(--fg)}
.dp .pip{width:4px;height:4px;background:var(--dim)}
.dp .pip.off{background:transparent}
.dp.today{border-color:var(--muted)}
.dp[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.dp[aria-pressed="true"] .w,.dp[aria-pressed="true"] .n{color:var(--bg)}
.dp[aria-pressed="true"] .pip{background:var(--bg)}
.agenda{display:flex;flex-direction:column;border-left:1px solid var(--line-hi);margin-left:4px}
.slot{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center;padding:10px 0 10px 12px;position:relative;border-bottom:1px solid var(--line)}
.slot::before{content:"";position:absolute;left:-4px;top:16px;width:7px;height:7px;background:var(--c)}
.slot .tm{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.3}
.slot.now{background:var(--raised)}
.slot.now .tm{color:var(--ink)}
.slot.past{opacity:.45}
.nowcard{border:1px solid var(--line-hi);background:var(--surface);padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nowcard div{display:flex;flex-direction:column;gap:3px;min-width:0}
.nowcard .k{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.nowcard .v{font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.nowcard .s{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.wgrid{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr));gap:2px;overflow:hidden}
.wgrid .col{position:relative;height:var(--h);background:var(--surface);border:1px solid var(--line)}
.wgrid .col.today{border-color:var(--muted)}
.wgrid .hrs{position:relative;height:var(--h)}
.wgrid .hrs span{position:absolute;right:4px;font-family:var(--f-mono);font-size:.54rem;color:var(--dim);transform:translateY(-50%)}
.wgrid .blk{position:absolute;left:1px;right:1px;background:var(--c);opacity:.75;border:0;padding:0;border-radius:0}
.wgrid .nowline{position:absolute;left:-1px;right:-1px;height:1px;background:var(--ink);box-shadow:0 0 4px var(--ink)}
.wgrid .wh{font-family:var(--f-mono);font-size:.58rem;letter-spacing:.1em;color:var(--dim);text-align:center}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:2px}
.hero q{quotes:none;font-family:var(--f-display);font-size:1.25rem;letter-spacing:.42em;text-transform:lowercase;color:var(--muted);text-align:center;padding-left:.42em}
.hero img{width:46%;max-width:150px;height:auto;display:block;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
/* v2: flat rows */
.toolbar{display:flex;align-items:center;gap:10px}
.toolbar h2{font-family:var(--f-display);font-weight:400;font-size:1.3rem;letter-spacing:.26em;text-transform:uppercase;color:var(--ink);margin:0;flex:1}
.btn.sm{padding:7px 12px;font-size:.82rem}
.icn{border:0;background:transparent;width:36px;height:36px;display:grid;place-items:center;color:var(--muted);border-radius:0}
.icn svg{width:18px;height:18px}
.icn.armed{width:auto;padding:0 10px;color:var(--ink);border:1px solid var(--muted);font-size:.78rem;font-weight:600}
.chip.link{cursor:pointer;color:var(--fg);border-style:dashed}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.drow{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.drow:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.drow .dn{display:block;font-weight:600;color:var(--fg);overflow-wrap:anywhere}
.drow .dk{display:block;margin-top:3px;font-family:var(--f-mono);font-size:.7rem;color:var(--muted);letter-spacing:.03em}
.drow .dl{text-align:right;font-family:var(--f-display);font-size:1.6rem;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}

.drow.past{opacity:.4}
.grp{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:6px 0 2px}
.wday{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--line)}
.wday.today{border-left:2px solid var(--ink);padding-left:10px;margin-left:-12px}
.wdh{display:flex;align-items:baseline;gap:10px}
.wdh .wn{font-family:var(--f-display);font-size:1.1rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);width:3.4em}
.wdh .wd{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);flex:1}
.wdh .tag{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--bg);background:var(--ink);padding:1px 6px}
.brow{all:unset;box-sizing:border-box;display:grid;grid-template-columns:7px 92px 1fr;gap:10px;align-items:center;padding:7px 0;cursor:pointer;min-width:0}
.brow i{width:7px;height:7px;background:var(--c)}
.brow .bt{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
.brow .bn{color:var(--fg);overflow-wrap:anywhere}
.brow.now .bt,.brow.now .bn{color:var(--ink);font-weight:600}
.brow.past{opacity:.4}
.brow:focus-visible{outline:2px solid var(--ink)}
.tline{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--muted);padding:3px 0 3px 17px}
.tline .check{width:20px;height:20px;border-width:1px}
.tline .check svg{width:12px;height:12px}
.free{font-size:.84rem;color:var(--dim);padding:4px 0 2px 17px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sunk);border-top:1px solid var(--line-hi);
  padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{border:0;background:transparent;padding:9px 2px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.62rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);position:relative}

<script>
(function(){
"use strict";
/* ---------- date helpers (local calendar days) ---------- */
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>ymd(new Date());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((Date.UTC(...ymdParts(b))-Date.UTC(...ymdParts(a)))/864e5); // b - a in days
function ymdParts(s){const [y,m,d]=s.split("-").map(Number);return [y,m-1,d]}
const fmt=s=>parse(s).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
const rel=s=>{const n=diff(today(),s);if(n===0)return"today";if(n===1)return"tomorrow";if(n===-1)return"yesterday";return n<0?Math.abs(n)+" days ago":"in "+n+" days"};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const KIND={exam:"Exam",deadline:"Deadline",goal:"Goal",event:"Event"};
const PALETTE=["#d6d6cf","#8f8f89","#55554f","#b3b3ac","#3f3f3b","#6f6f69","#c4c4bd","#7e7e78"];
/* film-grain texture, drawn once */
(function(){try{const c=document.createElement("canvas");c.width=c.height=160;const x=c.getContext("2d"),im=x.createImageData(160,160);
  for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=Math.random()<.5?14:0}
  x.putImageData(im,0,0);document.documentElement.style.setProperty("--grain","url("+c.toDataURL()+")")}catch(e){}})();

/* ---------- state ---------- */
function seed(){
  const t=today();
  const cats=[
    {id:"bio",name:"Biology",color:PALETTE[0]},
    {id:"chem",name:"Chemistry",color:PALETTE[1]},
    {id:"maths",name:"Maths",color:PALETTE[2]},
    {id:"ucas",name:"Medicine application",color:PALETTE[3]},
    {id:"gym",name:"Gym",color:PALETTE[5]},
    {id:"looks",name:"Looks",color:PALETTE[6]},
    {id:"life",name:"Personal",color:PALETTE[4]}];
  const e1=uid(),e2=uid(),e3=uid();
  return {v:1,example:true,minutesPerDay:180,cats,
    exams:[
      {id:e1,name:"Chemistry mock",date:addDays(t,12),cat:"chem",kind:"exam",example:true},
      {id:e2,name:"Maths mock: Pure 1",date:addDays(t,19),cat:"maths",kind:"exam",example:true},
      {id:e3,name:"Biology required practical write-up",date:addDays(t,5),cat:"bio",kind:"deadline",example:true}],
    tasks:[
      {id:uid(),title:"Finish RP write-up: enzyme rate vs temperature",cat:"bio",due:addDays(t,4),imp:3,mins:60,done:false,created:t,example:true},
      {id:uid(),title:"Past paper: Chemistry Paper 1 (energetics section)",cat:"chem",due:null,imp:3,mins:90,done:false,created:t,example:true},
      {id:uid(),title:"Integration by parts: exercise 11C",cat:"maths",due:addDays(t,2),imp:2,mins:45,done:false,created:t,example:true},
      {id:uid(),title:"Book UCAT practice session",cat:"ucas",due:addDays(t,-1),imp:2,mins:10,done:false,created:addDays(t,-6),example:true},
      {id:uid(),title:"Push day: chest, shoulders, triceps",cat:"gym",due:t,imp:2,mins:60,done:false,created:t,repeat:{type:"days",days:[1,3,5]},anchor:t,streak:3,example:true},
      {id:uid(),title:"Skincare: cleanse, moisturise, SPF",cat:"looks",due:t,imp:1,mins:5,done:false,created:t,repeat:{type:"daily"},anchor:t,streak:6,example:true},
      {id:uid(),title:"Tidy revision folder",cat:"life",due:null,imp:1,mins:20,done:false,created:addDays(t,-3),example:true}],
    topics:[
      {id:uid(),name:"Le Chatelier's principle",cat:"chem",ease:2.5,interval:0,reps:0,next:t,hist:[],example:true},
      {id:uid(),name:"Oxygen dissociation curves",cat:"bio",ease:2.5,interval:3,reps:2,next:t,hist:[],example:true},
      {id:uid(),name:"Differentiation from first principles",cat:"maths",ease:2.6,interval:6,reps:3,next:addDays(t,4),hist:[],example:true}]
  };
}
const STANDALONE=true;
const APP_VERSION="3";
let S=null, LS_KEY="studydesk.v1";
function loadLocal(){try{const r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}
S=loadLocal()||seed();
function migrate(st){
  if(!st.migGymLooks){
    if(!st.cats.some(c=>/^gym$/i.test(c.name)))st.cats.push({id:"gym",name:"Gym",color:PALETTE[5]});
    if(!st.cats.some(c=>/^looks$/i.test(c.name)))st.cats.push({id:"looks",name:"Looks",color:PALETTE[6]});
    st.migGymLooks=true;
  }
  if(!st.blocks)st.blocks=[];
  return st;
}
if(!S.blocks)S.blocks=[];
S=migrate(S);

/* account sync via db (private per-person doc) */
let dbRef=null, syncState="local", saveTimer=null, lastRemote=0;
function persist(){
  S.updated=Date.now();
  saveLocal();
  if(window.ascNotify)window.ascNotify.mirror(S);
  clearTimeout(saveTimer);
  saveTimer=setTimeout(pushRemote,600);
}
async function pushRemote(){
  if(!dbRef) return;
  try{await dbRef.set({json:JSON.stringify(S),updated:S.updated});syncState="cloud"}
  catch(e){syncState="local"}
  renderNote();
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    dbRef=db.collection("data/users/"+id).doc("state");
    const snap=await dbRef.get();
    const d=snap.exists?snap.data():null;
    if(d&&d.json){
      const remote=JSON.parse(d.json);
      if(!S.updated||(remote.updated||0)>=S.updated){S=migrate(remote);saveLocal();render()}
      else await pushRemote();
    } else await pushRemote();
    syncState="cloud"; renderNote();
  }catch(e){syncState="local";renderNote()}
})();

/* ---------- priority engine ---------- */
const catOf=id=>{const i=S.cats.findIndex(c=>c.id===id);if(i<0)return {name:"Uncategorised",color:"#3f3f3b"};const c=S.cats[i];return {...c,color:PALETTE.includes(c.color)?c.color:PALETTE[i%PALETTE.length]}};
const examOf=id=>S.exams.find(e=>e.id===id);
function nextExamFor(task){
  const t=today();
  if(task.exam){const e=examOf(task.exam);if(e&&diff(t,e.date)>=0)return e}
  return S.exams.filter(e=>e.cat===task.cat&&diff(t,e.date)>=0).sort((a,b)=>a.date<b.date?-1:1)[0];
}
function scoreTask(task){
  const t=today(); let s=task.imp*10; const why=[];
  why.push(["","Low importance","Medium importance","High importance"][task.imp]);
  if(task.due){
    const d=diff(t,task.due);
    if(d<0){s+=40+3*Math.min(-d,10);why.push("overdue")}
    else if(d===0){s+=32;why.push("due today")}
    else {s+=Math.round(26/(d+0.6));if(d<=3)why.push("due soon")}
  }
  const ex=nextExamFor(task);
  if(ex){const d=diff(t,ex.date); if(d<=30){s+=Math.round(5+22*(1-d/30));why.push(ex.name+" in "+d+"d")}}
  if(task.mins&&task.mins<=15){s+=4;why.push("quick win")}
  if(!task.due&&!ex){const age=Math.max(0,diff(task.created||t,t));const b=Math.min(10,Math.round(age*0.6));if(b>=3){s+=b;why.push("waiting a while")}}
  return {score:s,why};
}
function band(s){return s>=55?["Urgent","--urgent"]:s>=35?["High","--high"]:s>=20?["Medium","--med"]:["Low","--low"]}
function ranked(list){return list.map(x=>({t:x,...scoreTask(x)})).sort((a,b)=>b.score-a.score)}

/* ---------- repeating routines ---------- */
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function matches(task,d){const r=task.repeat;if(!r||r.type==="none")return false;
  if(r.type==="daily")return true;
  if(r.type==="days")return (r.days||[]).includes(parse(d).getDay());
  if(r.type==="every"){const n=Math.max(1,r.n||2),k=diff(task.anchor||task.due||d,d);return k>=0&&k%n===0}
  return false}
function nextOcc(task,after){for(let i=1;i<=400;i++){const d=addDays(after,i);if(matches(task,d))return d}return null}
function firstOcc(task,from){return matches(task,from)?from:nextOcc(task,from)}
function repeatLabel(r){if(!r||r.type==="none")return "";if(r.type==="daily")return "Daily";
  if(r.type==="days"){const o=[1,2,3,4,5,6,0].filter(x=>(r.days||[]).includes(x));return o.length===7?"Daily":o.map(x=>DOW[x]).join(" ")}
  return "Every "+(r.n||2)+" days"}
function completeRoutine(t){
  const td=today(); const onTime=!t.due||t.due>=td;
  t.streak=onTime?(t.streak||0)+1:1; t.best=Math.max(t.best||0,t.streak); t.lastDone=td;
  t.due=nextOcc(t,t.due&&t.due>td?t.due:td)||null; t.done=false;
  return t.due;
}

/* ---------- spaced repetition (SM-2 style, exam-aware) ---------- */
function preview(tp,q){
  let ease=tp.ease,reps=tp.reps,iv=tp.interval;
  if(q===1){reps=0;iv=1;ease=Math.max(1.3,ease-0.2)}
  else if(q===2){iv=Math.max(1,Math.round((iv||1)*1.2));ease=Math.max(1.3,ease-0.15)}
  else if(q===3){iv=reps===0?1:reps===1?3:Math.round(iv*ease);reps++}
  else {iv=reps===0?3:Math.round(Math.max(iv,1)*ease*1.3);ease+=0.15;reps++}
  let next=addDays(today(),iv), capped=false;
  const ex=tp.exam?examOf(tp.exam):S.exams.filter(e=>e.cat===tp.cat&&diff(today(),e.date)>1).sort((a,b)=>a.date<b.date?-1:1)[0];
  if(ex){const eve=addDays(ex.date,-1);if(diff(today(),eve)>0&&next>eve){next=eve;capped=ex.name}}
  return {ease,reps,interval:iv,next,capped};
}
function rateTopic(id,q){
  const tp=S.topics.find(x=>x.id===id); const p=preview(tp,q);
  Object.assign(tp,{ease:p.ease,reps:p.reps,interval:p.interval,next:p.next});
  tp.hist=(tp.hist||[]).concat([q]).slice(-12);
  persist(); render();
  toast("Next review "+rel(p.next)+(p.capped?" (before "+p.capped+")":""));
}
const dueTopics=()=>S.topics.filter(x=>x.next<=today()).sort((a,b)=>a.next<b.next?-1:1);

/* ---------- Google Calendar connection ---------- */
const CAL="Google Calendar", CONNECT_URL="https://claude.ai/settings/connectors";
let cal={state:"checking",msg:""};
async function checkCal(){
  try{
    const mcp=window.claude&&window.claude.use?await claude.use("mcp"):null;
    if(!mcp){cal={state:"unavailable",msg:""};return refreshCal()}
    const r=await mcp.listTools(CAL);const sv=r&&r.servers&&r.servers.find(x=>x.server===CAL);
    if(!sv||!sv.tools||!sv.tools.length)cal={state:"off",msg:""};
    else if(sv.authStatus==="needs_reauth")cal={state:"reauth",msg:""};
    else cal={state:sv.authStatus==="connected"?"on":"ask",msg:""};
  }catch(e){cal={state:e&&e.code==="server_not_connected"?"off":"unavailable",msg:""}}
  refreshCal();
}
async function allowCal(){
  cal={state:"working",msg:""};refreshCal();
  try{const mcp=await claude.use("mcp");await mcp.callTool(CAL,"list_calendars",{});cal={state:"on",msg:"Access allowed."}}
  catch(e){const c=e&&e.code;
    cal=c==="server_not_connected"?{state:"off",msg:""}:c==="needs_reauth"?{state:"reauth",msg:""}:
      c==="consent_required"||c==="not_granted"?{state:"ask",msg:"Access wasn't allowed. Tap Allow access to try again."}:
      {state:"ask",msg:"Couldn't reach Google Calendar just now. Try again in a moment."}}
  refreshCal();
}
function calCard(){
  const st=cal.state;
  const label={checking:"Checking…",working:"Connecting…",on:"Google Calendar connected",ask:"Connected — needs your permission",off:"Not connected",reauth:"Connection expired",unavailable:"Open ascension. in the Claude app or claude.ai to connect"}[st];
  const body=st==="on"?`<p class="help">ascension. can reach your calendar. Phone reminders for tasks, exams and reviews will come from Google Calendar on your Pixel.</p>`:
    st==="ask"?`<p class="help">Your calendar is linked to Claude. Allow ascension. to use it.</p><div class="actions"><button class="btn primary" data-act="allowCal">Allow access</button></div>`:
    st==="off"||st==="reauth"?`<p class="help">${st==="reauth"?"Sign in to Google again":"Sign in with Google"} on the Connectors page (find Google Calendar), then come back here and tap Check again.</p>
      <div class="actions"><a class="btn primary" href="${CONNECT_URL}" target="_blank" rel="noopener">Connect Google Calendar</a><button class="btn" data-act="checkCal">Check again</button></div>
      <p class="help" style="font-size:.78rem">Link doesn't open? Go to claude.ai › Settings › Connectors: <span style="user-select:all;font-family:var(--f-mono)">${CONNECT_URL}</span></p>`:"";
  return `<div class="calcard" id="calcard"><div class="st"><span class="led ${st==="on"?"on":""}"></span>${label}</div>${body}${cal.msg?`<p class="help">${esc(cal.msg)}</p>`:""}</div>`;
}
function refreshCal(){if(tab==="today"&&!document.getElementById("sheetHost").innerHTML)render();else document.querySelectorAll("#calcard").forEach(el=>el.outerHTML=calCard())}

/* ---------- Google Calendar links (real phone reminders) ---------- */
function gcalBlock(b){
  const d0=firstBlockDate(b), z=x=>x.replace(":","")+"00";
  const p=new URLSearchParams({action:"TEMPLATE",text:b.title,details:"Weekly timetable · "+catOf(b.cat).name+" · from ascension.",ctz:"Europe/London"});
  p.set("dates",d0.replace(/-/g,"")+"T"+z(b.start)+"/"+d0.replace(/-/g,"")+"T"+z(b.end>b.start?b.end:b.start));
  const BY=["SU","MO","TU","WE","TH","FR","SA"];
  p.set("recur","RRULE:FREQ=WEEKLY;BYDAY="+b.days.map(x=>BY[x]).join(","));
  return "https://calendar.google.com/calendar/render?"+p.toString();
}
function gcal(title,date,details,timeHHMM,recur){
  const p=new URLSearchParams({action:"TEMPLATE",text:title,details:details||"Added from ascension."});
  if(timeHHMM){const s=date.replace(/-/g,"")+"T"+timeHHMM.replace(":","")+"00";const [h,m]=timeHHMM.split(":").map(Number);const e=date.replace(/-/g,"")+"T"+pad((h+(m+30>=60?1:0))%24)+pad((m+30)%60)+"00";p.set("dates",s+"/"+e)}
  else p.set("dates",date.replace(/-/g,"")+"/"+addDays(date,1).replace(/-/g,""));
  if(recur)p.set("recur",recur);
  return "https://calendar.google.com/calendar/render?"+p.toString();
}

function chipCat(id){const c=catOf(id);return `<span class="chip" style="--c:${c.color}"><span class="dot"></span>${esc(c.name)}</span>`}
function taskRow(r){
  const t=r.t,[bn,bv]=band(r.score);
  const late=t.due&&!t.done&&t.due<today();
  return `<div class="task ${t.done?"done":""}" style="--pc:var(${bv})">
    <button class="check" data-act="toggle" data-id="${t.id}" aria-pressed="${t.done}" aria-label="Mark done">${t.done?I.check:""}</button>
    <div class="tbody"><div class="ttl">${esc(t.title)}</div>
      <div class="chips">${t.done?"":`<span class="chip prio">${bn}</span>`}${chipCat(t.cat)}
        ${t.due?`<span class="chip ${late?"late":""}">${late?"Overdue · ":"Due "}${esc(rel(t.due))}</span>`:""}
        ${t.mins?`<span class="chip">${t.mins} min</span>`:""}${t.repeat&&t.repeat.type!=="none"?`<span class="chip">↻ ${esc(repeatLabel(t.repeat))}</span>${t.streak?`<span class="chip">streak ${t.streak}</span>`:""}`:""}</div>
      ${t.done?"":`<div class="why">${esc(r.why.join(" · "))}</div>`}</div>
    <div><button class="more" data-act="editTask" data-id="${t.id}" aria-label="Edit task">${I.dots}</button><div class="score" title="Priority score">${t.done?"":r.score}</div></div>
  </div>`;
}
function exampleBanner(){
  return S.example?`<div class="banner"><p><b>These are example items</b> so you can see how it works. Clear them when you're ready to add your own.</p><button data-act="clearExamples">Clear examples</button></div>`:"";
}
function countdowns(){
  const up=S.exams.filter(e=>diff(today(),e.date)>=0).sort((a,b)=>a.date<b.date?-1:1);
  if(!up.length)return `<div class="empty">Nothing coming up. Add an exam, deadline, goal or event from the Dates tab.</div>`;
  return `<div class="strip">${up.map(e=>{const d=diff(today(),e.date),c=catOf(e.cat);return `<div class="cd ${d<=7?"soon":""}"><div class="n">${d}<span>${d===1?"day":"days"}</span></div><div class="t">${esc(e.name)}</div><div class="s" style="--c:${c.color}">${KIND[e.kind]||"Exam"} · ${esc(fmt(e.date))}</div></div>`}).join("")}</div>`;
}
function examLabel(tp){const e=tp.exam?examOf(tp.exam):null;
  if(e)return e.name;
  const auto=S.exams.filter(x=>x.cat===tp.cat&&diff(today(),x.date)>=0).sort((a,b)=>a.date<b.date?-1:1)[0];
  return auto?auto.name+" (auto)":"no date set"}
function topicTools(tp){return `<button class="icn" data-act="editTopic" data-id="${tp.id}" aria-label="Edit topic">${I.pen}</button><button class="icn" data-act="delTopic" data-id="${tp.id}" aria-label="Delete topic">${I.bin}</button>`}
function reviewCard(tp){
  const opts=[[1,"Again","again"],[2,"Hard",""],[3,"Good",""],[4,"Easy","easy"]];
  const hist=(tp.hist||[]).map(q=>`<i style="height:${q*5+2}px;background:var(${q===1?"--urgent":q===4?"--good":"--med"})"></i>`).join("");
  return `<div class="rev"><div class="row"><div class="tbody"><div class="ttl">${esc(tp.name)}</div>
    <div class="chips">${chipCat(tp.cat)}<button class="chip link" data-act="editTopic" data-id="${tp.id}">for: ${esc(examLabel(tp))}</button><span class="chip">Review #${tp.reps+1}</span>${tp.next<today()?`<span class="chip late">${esc(rel(tp.next))}</span>`:""}</div></div>
    ${hist?`<div class="hrow" title="Recent recall ratings">${hist}</div>`:""}
    ${topicTools(tp)}</div>
    <p class="help">Recall it from memory first (blurt, flashcards or a past-paper question), then rate how it went.</p>
    <div class="rates">${opts.map(([q,l,cls])=>{const p=preview(tp,q);return `<button class="rate ${cls}" data-act="rate" data-id="${tp.id}" data-q="${q}">${l}<small>${p.interval}d${p.capped?"*":""}</small></button>`}).join("")}</div>
  </div>`;
}

/* ---------- weekly timetable ---------- */
let weekDay=today();
const toMin=t=>{const [h,m]=(t||"0:0").split(":").map(Number);return h*60+m};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const blocksOn=d=>{const w=parse(d).getDay();return S.blocks.filter(b=>b.days.includes(w)).sort((a,b)=>a.start<b.start?-1:1)};
function firstBlockDate(b){const t=today();for(let i=0;i<7;i++){const d=addDays(t,i);if(b.days.includes(parse(d).getDay()))return d}return t}
const mondayOf=d=>addDays(d,-((parse(d).getDay()+6)%7));
function tasksOn(d){const t=today();
  return S.tasks.filter(x=>{if(x.done||!x.due)return false;
    if(x.due===d)return true; if(d===t&&x.due<t)return true;
    if(x.repeat&&x.repeat.type!=="none"&&d>x.due&&matches(x,d))return true; return false})}
function nowNext(){
  const bl=blocksOn(today()),n=nowMin();
  return {now:bl.find(b=>toMin(b.start)<=n&&n<toMin(b.end)),next:bl.find(b=>toMin(b.start)>n)};
}
function nowCard(){
  if(!S.blocks.length)return "";
  const {now,next}=nowNext();
  if(!now&&!next)return `<div class="nowcard"><div><span class="k">Now</span><span class="v">Free</span></div><div><span class="k">Next</span><span class="v">Nothing else today</span></div></div>`;
  return `<div class="nowcard"><div><span class="k">Now</span><span class="v">${now?esc(now.title):"Free"}</span><span class="s">${now?"until "+now.end:""}</span></div>
    <div><span class="k">Next</span><span class="v">${next?esc(next.title):"Nothing else today"}</span><span class="s">${next?"at "+next.start:""}</span></div></div>`;
}
function renderWeek(){
  const t=today(), mon=mondayOf(weekDay), days=[...Array(7)].map((_,i)=>addDays(mon,i)), n=nowMin();
  const sameWeek=mondayOf(t)===mon;
  view.innerHTML=`${exampleBanner()}
  <div class="toolbar"><button class="icn" data-act="week" data-d="-7" aria-label="Previous week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2>${sameWeek?"This week":"w/c "+parse(mon).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</h2>
    ${sameWeek?"":`<button class="btn sm" data-act="week" data-d="0">Today</button>`}
    <button class="icn" data-act="week" data-d="7" aria-label="Next week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 5l7 7-7 7"/></svg></button></div>
  ${S.blocks.length?"":`<div class="empty">Your timetable is empty. Tap + on any day to add a block, like "Gym: legs 16:30–17:45".<div class="actions" style="justify-content:center;margin-top:12px"><button class="btn sm" data-act="sampleWeek">Load a sample week</button></div></div>`}
  <div>${days.map(d=>{const isT=d===t, bl=blocksOn(d), tk=tasksOn(d).filter(x=>!x.done);
    return `<section class="wday ${isT?"today":""}"><div class="wdh"><span class="wn">${DOW[parse(d).getDay()]}</span><span class="wd">${esc(parse(d).toLocaleDateString("en-GB",{day:"numeric",month:"short"}))}</span>${isT?`<span class="tag">today</span>`:""}<button class="icn" data-act="addBlock" data-day="${d}" aria-label="Add a block on ${esc(fmt(d))}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button></div>
      ${bl.map(b=>{const st=isT?(toMin(b.end)<=n?"past":toMin(b.start)<=n?"now":""):(d<t?"past":"");return `<button class="brow ${st}" style="--c:${catOf(b.cat).color}" data-act="editBlock" data-id="${b.id}"><i></i><span class="bt">${b.start}–${b.end}</span><span class="bn">${esc(b.title)}</span></button>`}).join("")}
      ${tk.map(x=>`<div class="tline"><button class="check" data-act="toggle" data-id="${x.id}" aria-pressed="false" aria-label="Mark done"></button><span>${esc(x.title)}</span></div>`).join("")}
      ${!bl.length&&!tk.length?`<div class="free">Free</div>`:""}</section>`}).join("")}</div>
  <p class="help">Tap a block to change, delete or set a weekly phone reminder for it. Blocks repeat every week.</p>`;
}
function loadSampleWeek(){
  const mk=(title,cat,days,start,end)=>({id:uid(),title,cat,days,start,end,example:true});
  const has=id=>S.cats.some(c=>c.id===id)?id:(S.cats[0]&&S.cats[0].id);
  S.blocks.push(
    mk("School","life",[1,2,3,4,5],"08:45","15:30"),
    mk("Gym: push","gym",[1],"16:30","17:45"),mk("Gym: pull","gym",[3],"16:30","17:45"),mk("Gym: legs","gym",[5],"16:30","17:45"),
    mk("Chemistry revision","chem",[1,4],"19:00","20:30"),mk("Biology revision","bio",[2,5],"19:00","20:30"),
    mk("Maths practice","maths",[3],"19:00","20:30"),mk("Past paper (timed)","maths",[6],"10:00","12:00"),
    mk("Skincare","looks",[0,1,2,3,4,5,6],"22:00","22:15"),mk("Plan next week","life",[0],"18:00","18:30"));
  S.blocks.forEach(b=>b.cat=has(b.cat));
  S.example=true; persist(); render(); toast("Sample week loaded");
}

function renderToday(){
  const open=S.tasks.filter(t=>!t.done);
  const r=ranked(open);
  const must=r.filter(x=>x.t.due&&x.t.due<=today());
  const rest=r.filter(x=>!(x.t.due&&x.t.due<=today()));
  let budget=S.minutesPerDay||180, used=must.reduce((a,x)=>a+(x.t.mins||30),0);
  const plan=[...must];
  for(const x of rest){const m=x.t.mins||30;if(used+m<=budget||plan.length<3){plan.push(x);used+=m}}
  const doneToday=S.tasks.filter(t=>t.done&&t.doneAt===today()).length;
  const rev=dueTopics();
  view.innerHTML=`<section class="hero" aria-label="last man standing"><q>last man standing</q><img src="${HERO}" alt="" width="553" height="696"></section>${exampleBanner()}${S.blocks.length?`<section class="block"><div class="sechead"><h2>Timetable</h2><button class="btn" style="padding:4px 10px;font-size:.78rem" data-act="go" data-tab="week">Week</button></div>${nowCard()}</section>`:""}${!["on","unavailable","checking"].includes(cal.state)?`<section class="block"><div class="sechead"><h2>Phone reminders</h2></div>${calCard()}</section>`:""}
  <section class="block"><div class="sechead"><h2>Coming up</h2></div>${countdowns()}</section>

function renderMonth(){
  const first=parse(monthCur), y=first.getFullYear(), m=first.getMonth();
  const startOff=(first.getDay()+6)%7; // Monday first
  const daysIn=new Date(y,m+1,0).getDate();
  const cells=Math.ceil((startOff+daysIn)/7)*7;
  const t=today(), cap=S.minutesPerDay||180;
  const byDay={};
  const put=(d,k,v)=>{(byDay[d]=byDay[d]||{x:[],t:[],r:[]})[k].push(v)};
  S.exams.forEach(e=>put(e.date,"x",e));
  const gEnd=ymd(new Date(y,m,cells-startOff));
  S.tasks.filter(x=>x.due&&!x.done).forEach(x=>{put(x.due<t?t:x.due,"t",x);
    if(x.repeat&&x.repeat.type!=="none"){let d=x.due<t?t:x.due;for(let i=0;i<70;i++){d=nextOcc(x,d);if(!d||d>gEnd)break;put(d,"t",x)}}});
  S.topics.forEach(x=>put(x.next<t?t:x.next,"r",x));
  let g="";
  for(let i=0;i<cells;i++){
    const d=new Date(y,m,1-startOff+i), s=ymd(d), inM=d.getMonth()===m, b=byDay[s]||{x:[],t:[],r:[]};
    const mins=b.t.reduce((a,x)=>a+(x.mins||30),0);
    const items=[...b.x.map(e=>`<span class="bar x" title="${esc(e.name)}">${esc(e.name)}</span>`),...b.t.map(x=>`<span class="bar" style="--c:${catOf(x.cat).color}"></span>`),...b.r.map(x=>`<span class="bar r" style="--c:${catOf(x.cat).color}"></span>`)];
    const shown=items.slice(0,4), extra=items.length-shown.length;
    g+=`<button class="day ${inM?"":"out"} ${s===t?"today":""} ${s===selDay?"sel":""} ${b.x.length?"exam":""}" data-act="pickDay" data-day="${s}" aria-label="${esc(fmt(s))}: ${b.t.length} tasks, ${b.r.length} reviews${b.x.length?", "+b.x.length+" exam or deadline":""}">
      <span class="num">${d.getDate()}</span><span class="bars">${shown.join("")}${extra>0?`<span class="more-n">+${extra}</span>`:""}</span>
      ${mins?`<span class="load" title="${mins} of ${cap} min"><i style="width:${Math.min(100,Math.round(mins/cap*100))}%"></i></span>`:""}</button>`;
  }
  const b=byDay[selDay]||{x:[],t:[],r:[]};
  const dayTasks=ranked(b.t);
  view.innerHTML=`<div class="mhead"><button class="iconbtn" data-act="month" data-d="-1" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2>${first.toLocaleDateString("en-GB",{month:"long",year:"numeric"})}</h2>
    <button class="iconbtn" data-act="month" data-d="0" aria-label="Back to this month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/></svg></button>
    <button class="iconbtn" data-act="month" data-d="1" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 5l7 7-7 7"/></svg></button></div>
  <div class="grid">${["MON","TUE","WED","THU","FRI","SAT","SUN"].map(d=>`<span class="dow">${d}</span>`).join("")}${g}</div>
  <div class="legend"><span><i class="bar" style="--c:var(--fg)"></i>Task or routine</span><span><i class="bar r" style="--c:var(--fg)"></i>Review</span><span><i class="bar x" style="height:8px"></i>Exam / deadline</span><span><i class="load" style="height:3px;background:var(--ink)"></i>Workload vs daily time</span></div>
  <section class="block"><div class="sechead"><h2>${esc(fmt(selDay))}</h2><span class="meta">${rel(selDay)}</span></div>
    ${b.x.map(e=>`<div class="exam"><div class="d"><b>${Math.max(0,diff(t,e.date))}</b><small>days</small></div><div class="tbody"><div class="ttl">${esc(e.name)}</div><div class="chips">${chipCat(e.cat)}<span class="chip">${KIND[e.kind]||"Exam"}</span></div></div><button class="more" data-act="editExam" data-id="${e.id}" aria-label="Edit">${I.dots}</button></div>`).join("")}
    ${dayTasks.length?`<div class="list">${dayTasks.map(taskRow).join("")}</div>`:""}
    ${b.r.length?`<div class="list">${b.r.map(tp=>`<div class="task" style="--pc:var(--med)"><span></span><div class="tbody"><div class="ttl">${esc(tp.name)}</div><div class="chips">${chipCat(tp.cat)}<span class="chip">Review</span></div></div><button class="more" data-act="editTopic" data-id="${tp.id}" aria-label="Edit topic">${I.dots}</button></div>`).join("")}</div>`:""}
    ${!b.x.length&&!dayTasks.length&&!b.r.length?`<div class="empty">Nothing on this day. Tap + to add a task due ${esc(fmt(selDay))}.</div>`:""}
    <p class="help">Overdue tasks and missed reviews are shown on today. Tasks without a due date don't appear here; find them in Tasks.</p>
  </section>`;
}

function wireForm(sh,k,item){
  const f=sh.querySelector("#f");
  const fx=sh.querySelector("#f-exam");
  if(fx)fx.onchange=()=>{const w=sh.querySelector("#f-newexam");w.hidden=fx.value!=="__new";if(!w.hidden)sh.querySelector("#f-nname").focus()};
  const examPick=()=>{const v=fx?fx.value:"";if(v!=="__new")return v||null;
    const n=(sh.querySelector("#f-nname").value||"").trim();if(!n)return undefined;
    const e={id:uid(),name:n,date:sh.querySelector("#f-ndate").value||addDays(today(),14),cat:val("f-cat"),kind:"exam"};S.exams.push(e);return e.id};
  const rs=sh.querySelector("#f-rep");

  sh.querySelectorAll("#f-bdays button").forEach(b=>b.onclick=()=>b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true"));
  sh.querySelectorAll("#f-days button").forEach(b=>b.onclick=()=>b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true"));
  sh.querySelectorAll(".seg[id^=f-]:not(#f-days):not(#f-bdays) button").forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  const val=id=>{const el=sh.querySelector("#"+id);return el?el.value.trim():""};
  const segv=id=>{const b=sh.querySelector("#"+id+" button[aria-pressed=true]");return b&&b.dataset.v};
  const del=sh.querySelector("#del");
  if(del)del.onclick=()=>{
    if(del.dataset.armed){const key=k==="task"?"tasks":k==="topic"?"topics":k==="block"?"blocks":"exams";S[key]=S[key].filter(x=>x.id!==item.id);persist();closeSheet();render();toast("Deleted")}
    else{del.dataset.armed=1;del.textContent="Tap again to delete"}
  };
  f.onsubmit=e=>{e.preventDefault();const title=val("f-title");if(!title)return;
    let exId=null;if(fx){exId=examPick();if(exId===undefined){toast("Give the new date a name");return}}
    if(k==="block"){const days=[...sh.querySelectorAll("#f-bdays button[aria-pressed=true]")].map(b=>Number(b.dataset.v));
      if(!days.length){toast("Pick at least one day");return}
      const st=val("f-start")||"17:00",en=val("f-end")||st;
      if(en<=st){toast("End time must be after the start");return}
      const o=item||{id:uid()};Object.assign(o,{title,cat:val("f-cat"),days,start:st,end:en});if(!item)S.blocks.push(o);
      persist();closeSheet();render();toast(item?"Saved":"Added to timetable");return}
    if(k==="task"){const o=item||{id:uid(),done:false,created:today()};
      Object.assign(o,{title,cat:val("f-cat"),due:val("f-due")||null,imp:Number(segv("f-imp")||2),mins:Number(val("f-mins"))||30,exam:exId});
      const rt=val("f-rep")||"none";
      if(rt==="none")o.repeat=null;
      else{const days=[...sh.querySelectorAll("#f-days button[aria-pressed=true]")].map(b=>Number(b.dataset.v));
        o.repeat={type:rt==="days"&&!days.length?"daily":rt,days,n:Math.max(2,Number(val("f-n"))||2)};
        o.anchor=o.due||today(); if(!o.due||!matches(o,o.due))o.due=firstOcc(o,o.due||today()); o.done=false}
      if(!item)S.tasks.push(o)}
    else if(k==="topic"){const o=item||{id:uid(),ease:2.5,interval:0,reps:0,next:today(),hist:[]};
      Object.assign(o,{name:title,cat:val("f-cat"),exam:exId});if(item&&val("f-next"))o.next=val("f-next");
      if(!item)S.topics.push(o)}
    else{const o=item||{id:uid()};Object.assign(o,{name:title,date:val("f-date"),cat:val("f-cat"),kind:val("f-kind")||"exam"});if(!item)S.exams.push(o)}
    persist();closeSheet();render();toast(item?"Saved":"Added");
  };
}
function editSheet(k,id){
  const key=k==="task"?"tasks":k==="topic"?"topics":k==="block"?"blocks":"exams";const it=S[key].find(x=>x.id===id);if(!it)return;
  openSheet(`<h3>Edit ${k==="block"?"block":k==="exam"?(KIND[it.kind]||"Exam").toLowerCase():k}</h3>${formFor(k,it)}`,sh=>wireForm(sh,k,it));
}
function settingsSheet(){
  openSheet(`<h3>Settings</h3>
    <label class="f">Time available per day (minutes)<input id="s-mins" type="number" min="15" step="15" inputmode="numeric" value="${S.minutesPerDay||180}"></label>
    <p class="help">Today's plan fills up to this many minutes with your highest-priority tasks. Anything overdue or due today is always included.</p>
    <div class="sechead"><h2>Categories</h2></div>
    <div class="list" id="cats">${S.cats.map(c=>`<div class="catrow" data-id="${c.id}"><button type="button" class="swatch" style="--c:${catOf(c.id).color}" aria-label="Change shade"></button><input type="text" id="cat-${c.id}" value="${esc(c.name)}" aria-label="Category name"><button type="button" class="more" data-del="${c.id}" aria-label="Remove category">✕</button></div>`).join("")}</div>
    <button type="button" class="btn" id="addCat">+ Add category</button>
    
    <div class="sechead"><h2>Daily reminder on your phone</h2></div>
    <p class="help">Creates a repeating Google Calendar event so your Pixel pings you to open ascension. every day.</p>
    <div class="two"><label class="f">Time<input id="s-time" type="time" value="17:00"></label><div style="display:flex;align-items:flex-end"><a class="btn" id="dailyLink" target="_blank" rel="noopener" href="#">${I.bell} Create reminder</a></div></div>
    ${STANDALONE?`<div class="sechead"><h2>Notifications</h2></div><p class="help" id="ntfTxt"></p><div class="actions"><button type="button" class="btn" id="ntfBtn">Turn on notifications</button></div>`:""}
    <div class="sechead"><h2>Your data</h2></div>
    <p class="help">${STANDALONE?"Your data lives only on this phone. Download a backup now and then.":"Moving to the offline app? Tap Copy my data, then paste it into Import in the offline app's settings."}</p>
    <div class="actions"><button type="button" class="btn" id="expCopy">Copy my data</button>${STANDALONE?`<button type="button" class="btn" id="expFile">Download backup</button>`:""}</div>
    <label class="f">Paste data or an update code<textarea id="impTxt" rows="3" placeholder="Paste copied data here"></textarea></label>
    <div class="actions"><button type="button" class="btn" id="impBtn">Import</button>${STANDALONE?`<button type="button" class="btn" id="undoUpd" hidden>Undo last update</button>`:""}</div>
    <p class="help" style="font-size:.8rem">Data you paste replaces what's in the app. An update code changes the app itself and leaves your data alone.</p>
    <div class="actions"><button class="btn primary" id="saveSet">Save</button></div>
    <p class="note"><span class="led ${syncState==="cloud"?"on":""}"></span><span id="syncTxt">${syncState==="cloud"?"Saved to your Claude account":"Saved on this device"} · version 3</span></p>`,
  sh=>{
    const upd=()=>{sh.querySelector("#dailyLink").href=gcal("ascension.: check today's plan",today(),"Open ascension. and work through today's plan and reviews.",sh.querySelector("#s-time").value||"17:00","RRULE:FREQ=DAILY")};
    sh.querySelector("#s-time").oninput=upd;upd();
    sh.querySelectorAll(".swatch").forEach(b=>b.onclick=()=>{const c=S.cats.find(x=>x.id===b.parentElement.dataset.id);c.color=PALETTE[(PALETTE.indexOf(c.color)+1)%PALETTE.length];b.style.setProperty("--c",c.color)});
    sh.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const id=b.dataset.del;const used=S.tasks.some(t=>t.cat===id)||S.topics.some(t=>t.cat===id)||S.exams.some(t=>t.cat===id);
      if(used&&!b.dataset.armed){b.dataset.armed=1;b.textContent="Sure?";toast("Items in this category will show as Uncategorised");return}
      S.cats=S.cats.filter(c=>c.id!==id);b.parentElement.remove()});
    sh.querySelector("#addCat").onclick=()=>{const c={id:uid(),name:"New category",color:PALETTE[S.cats.length%PALETTE.length]};S.cats.push(c);persist();settingsSheet()};
    const json=()=>JSON.stringify(S);
    sh.querySelector("#expCopy").onclick=()=>{const t=sh.querySelector("#impTxt");
      const fb=()=>{t.value=json();t.focus();t.select();toast("Data is in the box: select all and copy")};
      try{navigator.clipboard.writeText(json()).then(()=>toast("Copied. Paste it into the other app's Import box."),fb)}catch(e){fb()}};
    const ef=sh.querySelector("#expFile");
    if(ef)ef.onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json()],{type:"application/json"}));a.download="ascension-backup-"+today()+".json";document.body.appendChild(a);a.click();a.remove()};
    const ib=sh.querySelector("#impBtn");
    ib.onclick=()=>{const raw=sh.querySelector("#impTxt").value.trim();
      if(raw.startsWith("ASCENSION-UPDATE:")){if(!STANDALONE){toast("Paste update codes into the installed app, not here.");return}installUpdate(raw,ib);return}
      let o;try{o=JSON.parse(raw)}catch(e){toast("That isn't valid data. Copy it again and paste the whole thing.");return}
      if(!o||!Array.isArray(o.tasks)||!Array.isArray(o.cats)){toast("That isn't ascension. data.");return}
      if(!ib.dataset.armed){ib.dataset.armed=1;ib.textContent="Tap again to replace everything";return}
      if(!o.blocks)o.blocks=[];S=migrate(o);persist();closeSheet();render();toast("Imported")};
    if(STANDALONE&&window.ascNotify)window.ascNotify.wire(sh);
    const uu=sh.querySelector("#undoUpd");
    if(uu&&"caches" in window)caches.has("ascension-override").then(h=>{uu.hidden=!h});
    if(uu)uu.onclick=async()=>{if(!uu.dataset.armed){uu.dataset.armed=1;uu.textContent="Tap again to undo";return}
      await caches.delete("ascension-override");toast("Going back to the installed version");setTimeout(()=>location.reload(),700)};
    sh.querySelector("#saveSet").onclick=()=>{S.minutesPerDay=Math.max(15,Number(sh.querySelector("#s-mins").value)||180);
      S.cats.forEach(c=>{const el=sh.querySelector("#cat-"+CSS.escape(c.id));if(el&&el.value.trim())c.name=el.value.trim()});
      persist();closeSheet();render();toast("Settings saved")};
  });
}
async function installUpdate(raw,btn){
  try{
    if(!("caches" in window)||!("DecompressionStream" in window)||!navigator.serviceWorker||!navigator.serviceWorker.controller){toast("Updates need the installed app, opened online at least once.");return}
    const parts=raw.replace(/\s+/g,"").split(":"), ver=parts[1], b64=parts.slice(2).join("");
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    if(!/^<!doctype html>/i.test(html)||html.indexOf("ascension.")<0||html.indexOf('const STANDALONE=true')<0){toast("That update code is damaged. Copy it again.");return}
    const c=await caches.open("ascension-override");
    await c.put("./index.html",new Response(html,{headers:{"Content-Type":"text/html; charset=utf-8"}}));
    if(btn)btn.textContent="Updated";
    toast("Updating to version "+ver+"…");setTimeout(()=>location.reload(),900);
  }catch(e){toast("That update code didn't work. Copy the whole code and try again.")}
}
function renderNote(){const t=document.getElementById("syncTxt");if(t)t.textContent=syncState==="cloud"?"Saved to your Claude account":"Saved on this device"}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==="toggle"){const t=S.tasks.find(x=>x.id===id);
    if(t.repeat&&t.repeat.type!=="none"&&!t.done){const nx=completeRoutine(t);persist();render();toast("Streak "+t.streak+". Next: "+(nx?fmt(nx):"none"))}
    else{t.done=!t.done;t.doneAt=t.done?today():null;persist();render();if(t.done)toast("Done.")}}
  else if(a==="editTask")editSheet("task",id);
  else if(a==="editTopic")editSheet("topic",id);
  else if(a==="editExam")editSheet("exam",id);
  else if(a==="rate")rateTopic(id,Number(b.dataset.q));
  else if(a==="pickDay"){selDay=b.dataset.day;if(selDay.slice(0,7)!==monthCur.slice(0,7))monthCur=selDay.slice(0,7)+"-01";render()}
  else if(a==="month"){const d=Number(b.dataset.d);if(d===0){monthCur=today().slice(0,7)+"-01";selDay=today()}else{const x=parse(monthCur);x.setMonth(x.getMonth()+d);monthCur=ymd(x)}render()}
  else if(a==="allowCal")allowCal();
  else if(a==="addTopic")addMenu("topic");
  else if(a==="addDate")addMenu("exam");
  else if(a==="addBlock"){weekDay=b.dataset.day;addMenu("block")}
  else if(a==="togglePast"){showPast=!showPast;render()}
  else if(a==="delTopic"){if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Delete?";setTimeout(()=>{if(b.isConnected){b.classList.remove("armed");b.innerHTML=I.bin}},3000);return}
    S.topics=S.topics.filter(x=>x.id!==id);persist();render();toast("Topic deleted")}
  else if(a==="editBlock")editSheet("block",id);
  else if(a==="wday"){weekDay=b.dataset.day;render()}
  else if(a==="week"){const d=Number(b.dataset.d);weekDay=d===0?today():addDays(weekDay,d);render()}
  else if(a==="sampleWeek")loadSampleWeek();
  else if(a==="checkCal"){cal={state:"checking",msg:""};refreshCal();checkCal()}
  else if(a==="filter"){catFilter=b.dataset.cat;render()}
  else if(a==="toggleDone"){showDone=!showDone;render()}
  else if(a==="go"){tab=b.dataset.tab;render();scrollTo(0,0)}
  else if(a==="clearExamples"){S.tasks=S.tasks.filter(x=>!x.example);S.topics=S.topics.filter(x=>!x.example);S.exams=S.exams.filter(x=>!x.example);S.blocks=S.blocks.filter(x=>!x.example);S.example=false;persist();render();toast("Examples cleared. Tap + to add your own.")}
});
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();scrollTo(0,0)});
document.getElementById("fab").onclick=addMenu;
document.getElementById("settingsBtn").onclick=settingsSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
let tt;function toast(m){const h=document.getElementById("toastHost");h.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(tt);tt=setTimeout(()=>h.innerHTML="",2400)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});

render();
setInterval(()=>{if((tab==="today"||tab==="week")&&!document.getElementById("sheetHost").innerHTML)render()},60000);
})();
</script>
